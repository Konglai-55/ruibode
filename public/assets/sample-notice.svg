<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title desc"><title id="title">赛事举办通知示例</title><desc id="desc">包含组织单位、参赛对象、时间地点、报名办法和注意事项的赛事通知</desc><rect width="1000" height="1500" fill="#fff"/><rect x="36" y="36" width="928" height="1428" rx="14" fill="none" stroke="#d7e0ea" stroke-width="3"/><text x="500" y="125" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" fill="#1e3a5f" font-weight="700">瑞卜德教育青少年机器人赛事组委会</text><text x="500" y="218" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="45" fill="#0f172a" font-weight="800">关于举办 2026—2027 赛季</text><text x="500" y="280" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="45" fill="#0f172a" font-weight="800">青少年机器人城市挑战赛的通知</text><rect x="120" y="328" width="760" height="5" fill="#16a34a"/>
<g font-family="Arial,'Microsoft YaHei',sans-serif" font-size="24" fill="#334155"><text x="110" y="405">各有关学校、科技教育机构及参赛队：</text><text x="110" y="455">为培养青少年的工程实践、创新思维和团队协作能力，现举办</text><text x="110" y="495">2026—2027 赛季青少年机器人城市挑战赛。有关事项如下：</text><text x="110" y="575" font-size="28" font-weight="700" fill="#1e3a5f">一、组织单位</text><text x="135" y="625">主办单位：上海瑞卜德教育科技有限公司</text><text x="135" y="665">承办单位：瑞卜德教育青少年机器人赛事组委会</text><text x="110" y="745" font-size="28" font-weight="700" fill="#1e3a5f">二、参赛对象与组别</text><text x="135" y="795">小学组、初中组、高中组及大学组在校学生。</text><text x="110" y="875" font-size="28" font-weight="700" fill="#1e3a5f">三、报名办法</text><text x="135" y="925">参赛单位须先在报名平台创建教练、队员及战队信息，</text><text x="135" y="965">选择相应参赛组别并上传缴费凭证后提交审核。</text><text x="110" y="1045" font-size="28" font-weight="700" fill="#1e3a5f">四、注意事项</text><text x="135" y="1095">1. 请确保报名信息真实、完整，证件信息仅用于资格审核。</text><text x="135" y="1135">2. 报名截止后不再接受新增队伍，已通过记录不可自行删除。</text><text x="135" y="1175">3. 组委会将通过报名邮箱发送审核结果与后续通知。</text><text x="780" y="1320" text-anchor="middle">瑞卜德教育青少年机器人赛事组委会</text><text x="780" y="1360" text-anchor="middle">2026 年 8 月</text></g></svg>
